<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>The long way home · A cat on a bicycle</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #f5efdf;
    }

    body {
      display: grid;
      place-items: center;
    }

    main {
      width: min(100vw, 108.108vh, 1040px);
      width: min(100vw, 108.108svh, 1040px);
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
    }

    /* Local zeroes are the hubs, established by the enclosing translations. */
    .wheel-spin {
      transform-origin: 0 0;
      animation: turn 1.6s linear infinite;
    }

    .crank-spin {
      transform-origin: 0 0;
      animation: turn 2.4s linear infinite;
    }

    /* Linear rotation follows the constant-speed crank. Counter-rotation keeps
       the paws level, with the circling upper joints concealed by the haunch. */
    .pedal-level {
      transform-origin: 0 0;
      animation: level 2.4s linear infinite;
    }

    .tail {
      transform-origin: 295px 369px;
      animation: tail-sway 3.8s cubic-bezier(0.77, 0, 0.175, 1) infinite;
    }

    .scarf-end {
      transform-origin: 438px 294px;
      animation: scarf-flutter 2.8s cubic-bezier(0.77, 0, 0.175, 1) infinite;
    }

    .clouds {
      animation: cloud-drift 9s cubic-bezier(0.77, 0, 0.175, 1) infinite;
    }

    @keyframes turn {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes level {
      from { transform: rotate(0deg); }
      to { transform: rotate(-360deg); }
    }

    @keyframes tail-sway {
      0%, 100% { transform: rotate(-5deg); }
      50% { transform: rotate(6deg); }
    }

    @keyframes scarf-flutter {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(12deg); }
    }

    @keyframes cloud-drift {
      0%, 100% { transform: translateX(-10px); }
      50% { transform: translateX(10px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .wheel-spin, .crank-spin, .pedal-level,
      .tail, .scarf-end, .clouds {
        animation: none;
        transform: none;
      }
    }
  </style>
</head>

      <title id="scene-title">The long way home</title>
      <desc id="scene-description">A very round ginger cat in a red scarf pedals a teal

        the pedals, and its striped tail sways. Two spoked wheels roll past green
        hills beneath a warm sun. With reduced motion, the whole scene rests.</desc>
